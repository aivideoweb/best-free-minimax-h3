name: Tool or video update
description: Report changed free conditions, broken links, or a sourced addition.
title: '[Directory] '
body:
  - type: input
    id: url
    attributes:
      label: Exact tool or X post URL
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Check date and access method
      placeholder: YYYY-MM-DD; direct browser, indexed page, or public reader
    validations:
      required: true
  - type: dropdown
    id: evidence_type
    attributes:
      label: What did you check?
      options:
        - Page only; no generation
        - Generation completed and output reviewed
        - Creator post and video source
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Change, evidence, limits and any relationship to the service
      description: Include settings, signup/cost changes or source links. Do not share credentials or private user data.
    validations:
      required: true
